name: Feature Request
description: Propose a new feature, agent role, or sandbox integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Pillar Alignment
      description: Which of the five pillars does this relate to (citations, sandbox, battle, ledger, self-healing)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features considered.
